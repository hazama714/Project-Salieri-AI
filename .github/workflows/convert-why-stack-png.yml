name: Convert Why This Stack images to PNG

on:
  push:
    paths:
      - '.image-trigger'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stop if trigger is absent
        id: guard
        shell: bash
        run: |
          if [ ! -f .image-trigger ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Pillow
        if: steps.guard.outputs.run == 'true'
        run: python3 -m pip install --quiet pillow

      - name: Convert WebP assets to PNG
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          assets = Path('docs/assets')
          names = ['why-stack', 'why-android', 'why-unity', 'why-arduino']
          for name in names:
              src = assets / f'{name}.webp'
              dst = assets / f'{name}.png'
              if not src.exists():
                  raise FileNotFoundError(src)
              with Image.open(src) as im:
                  im.convert('RGB').save(dst, format='PNG', optimize=True)
              print(f'{src} -> {dst}')
          PY
          rm -f docs/assets/why-stack.webp docs/assets/why-android.webp docs/assets/why-unity.webp docs/assets/why-arduino.webp
          rm -f .image-trigger

      - name: Commit PNG assets
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Convert Why This Stack illustrations to PNG"
          git push
